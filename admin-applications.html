<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Seller applications · Admin · Phyzel</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="responsive.css">
</head>
<body>
  <main class="container dashboard">
    <a class="brand" href="index.html">phyzel<span>.</span></a>
    <div id="adminApplicationsRoot" class="section"><div class="notice">Loading seller applications…</div></div>
  </main>
  <script src="app.js"></script>
  <script>
    (function () {
      const P = window.Phyzel;
      const root = document.querySelector('#adminApplicationsRoot');

      function renderApplications(applications) {
        if (!applications.length) {
          root.innerHTML = '<div class="section-head"><div><div class="eyebrow">Administration</div><h1>Seller applications</h1></div><a class="btn btn-secondary" href="admin-dashboard.html">Back to dashboard</a></div><div class="notice">There are no seller applications yet.</div>';
          return;
        }
        root.innerHTML = '<div class="section-head"><div><div class="eyebrow">Administration</div><h1>Seller applications</h1><p class="muted">Review business details before granting seller access.</p></div><a class="btn btn-secondary" href="admin-dashboard.html">Back to dashboard</a></div>' + applications.map((application) => {
          const pending = ['Draft', 'Pending', 'Under Review'].includes(application.status);
          return `<article class="admin-card" style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap"><div><h2 style="margin:0 0 4px">${P.escape(application.business_name)}</h2><p class="muted small">${P.escape(application.account_name)} · ${P.escape(application.email)} · ${P.escape(application.category)}</p></div><span class="pill">${P.escape(application.status)}</span></div><p>${P.escape(application.description)}</p><p class="small muted">${P.escape(application.country || 'Ghana')}${application.region ? ' · ' + P.escape(application.region) : ''}${application.business_type ? ' · ' + P.escape(application.business_type) : ''}</p>${pending ? `<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-primary" data-review="Approved" data-id="${P.escape(application.id)}">Approve</button><button class="btn btn-secondary" data-review="Changes Requested" data-id="${P.escape(application.id)}">Request changes</button><button class="btn btn-ghost" data-review="Rejected" data-id="${P.escape(application.id)}">Reject</button></div>` : '<p class="small muted">This application has already been reviewed.</p>'}</article>`;
        }).join('');
        root.querySelectorAll('[data-review]').forEach((button) => button.addEventListener('click', async () => {
          const notes = window.prompt('Optional admin notes:', '') || '';
          button.disabled = true;
          try {
            await P.request('/api/admin/applications/' + encodeURIComponent(button.dataset.id), { method: 'POST', body: JSON.stringify({ status: button.dataset.review, notes }) });
            P.toast('Application updated.');
            await load();
          } catch (error) {
            P.toast(error.message, 'error');
            button.disabled = false;
          }
        }));
      }

      async function load() {
        try {
          const user = await P.me();
          if (!user || user.role !== 'admin') {
            root.innerHTML = '<div class="form-shell"><h1>Admin access required</h1><p class="muted">Only platform administrators can review seller applications.</p><a class="btn btn-primary" href="login.html">Sign in</a></div>';
            return;
          }
          renderApplications((await P.request('/api/admin/applications')).applications);
        } catch (error) {
          root.innerHTML = '<div class="notice error" role="alert">' + P.escape(error.message || 'Applications are temporarily unavailable.') + '</div>';
        }
      }
      document.addEventListener('DOMContentLoaded', load);
    }());
  </script>
</body>
</html>
