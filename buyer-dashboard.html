<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buyer Dashboard · Phyzel</title><link rel="stylesheet" href="styles.css"></head><body><main class="container dashboard"><a class="brand" href="index.html">phyzel<span>.</span></a><div id="buyer-dashboard" class="section"><div class="notice">Loading your buyer dashboard…</div></div></main><script src="app.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const root=document.querySelector('#buyer-dashboard');try{const user=await Phyzel.me();if(!user){root.innerHTML='<div class="form-shell"><h1>Sign in required</h1><a class="btn btn-primary" href="login.html">Sign in</a></div>';return}const orders=(await Phyzel.request('/api/orders')).orders;root.innerHTML='<div class="eyebrow">Buyer dashboard</div><h1>Welcome, '+Phyzel.escape(user.name)+'</h1><p class="muted">'+Phyzel.escape(user.email)+'</p><div class="hero-actions"><a class="btn btn-primary" href="index.html">Explore marketplaces</a><button class="btn btn-secondary" id="signout">Sign out</button></div><h2 style="margin-top:40px">Your orders</h2>'+(orders.length?'<table class="table"><tr><th>Reference</th><th>Status</th><th>Total</th></tr>'+orders.map(x=>'<tr><td>'+Phyzel.escape(x.reference)+'</td><td>'+Phyzel.escape(x.payment_status)+'</td><td>'+Phyzel.money(x.total,x.currency)+'</td></tr>').join('')+'</table>':'<div class="notice">You have not placed an order yet. Explore the Fashion, Food, or Trading Marketplace to get started.</div>');document.querySelector('#signout')?.addEventListener('click',async()=>{await Phyzel.request('/api/auth/logout',{method:'POST'});location.href='index.html'})}catch(error){root.innerHTML='<div class="notice error">'+Phyzel.escape(error.message)+'</div>'}});</script></body></html>
