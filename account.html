<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My account · Phyzel</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="index.html">phyzel<span>.</span></a><nav class="nav-links"><a href="index.html">Browse</a><a href="seller-application.html">Sell on Phyzel</a></nav></div></header><main class="container dashboard"><div id="account-root"><div class="notice">Loading your account…</div></div></main><script src="app.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const r=document.querySelector('#account-root');try{const u=await Phyzel.me();if(!u){r.innerHTML='<div class="form-shell"><h1>Sign in required</h1><p class="muted">Sign in to see your orders.</p><a class="btn btn-primary" href="login.html">Sign in</a></div>';return}const o=await Phyzel.request('/api/orders');r.innerHTML='<div class="eyebrow">Customer account</div><h1>Welcome, '+Phyzel.escape(u.name)+'</h1><p class="muted">'+Phyzel.escape(u.email)+'</p><h2>Order history</h2>'+(o.orders.length?'<table class="table"><tr><th>Reference</th><th>Status</th><th>Total</th></tr>'+o.orders.map(x=>'<tr><td>'+Phyzel.escape(x.reference)+'</td><td>'+Phyzel.escape(x.payment_status)+'</td><td>'+Phyzel.money(x.total,x.currency)+'</td></tr>').join('')+'</table>':'<div class="notice">No orders yet. <a href="index.html">Browse the marketplace</a>.</div>')}catch(e){r.innerHTML='<div class="notice error">'+Phyzel.escape(e.message)+'</div>'}});</script></body></html>
