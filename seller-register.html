<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apply as a Seller · Phyzel</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="responsive.css"></head><body><main class="container"><div class="form-shell"><a class="brand" href="index.html">phyzel<span>.</span></a><div class="eyebrow" style="margin-top:28px">Seller onboarding</div><h1>Apply as a seller</h1><p class="muted">Seller applications are saved as drafts and must be reviewed before you can publish listings or receive marketplace orders.</p><form data-seller-registration><label>Full legal name<input class="input" name="applicantName" autocomplete="name" required></label><label>Email address<input class="input" name="email" type="email" autocomplete="email" required></label><label>Password<input class="input" name="password" type="password" minlength="8" autocomplete="new-password" required></label><label>Confirm password<input class="input" name="passwordConfirmation" type="password" minlength="8" autocomplete="new-password" required></label><label>Business or trading name<input class="input" name="businessName" required></label><label>Marketplace<select class="select" name="category" required><option value="Fashion">Fashion Marketplace</option><option value="Food">Food Marketplace</option><option value="Trading">Trading Marketplace</option></select></label><label>Business type<select class="select" name="businessType"><option>Individual seller</option><option>Sole proprietor</option><option>Partnership</option><option>Registered company</option></select></label><label>Country<input class="input" name="country" value="Ghana" required></label><label>Region or city<input class="input" name="region"></label><label>Business location<input class="input" name="businessLocation"></label><label>Phone<input class="input" name="phone" type="tel"></label><label>Website or social link<input class="input" name="website" type="url"></label><label>Business description<textarea name="description" minlength="20" required></textarea></label><label>What do you intend to offer?<textarea name="offeringDescription" required></textarea></label><label>Business registration status<select class="select" name="registrationStatus"><option>Not applicable</option><option>Pending</option><option>Registered</option></select></label><label>Registration number, if applicable<input class="input" name="registrationNumber"></label><label><input type="checkbox" name="termsAccepted" required> I confirm I have the right to sell these offerings and accept seller terms.</label><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px"><button class="btn btn-secondary" type="button" data-save-draft>Save draft</button><button class="btn btn-primary" type="submit">Submit application</button></div></form><p class="small muted">Already have an account? <a href="login.html">Sign in</a> · <a href="register.html">Choose another path</a>.</p></div></main><script src="app.js"></script><script src="onboarding.js"></script></body></html>
